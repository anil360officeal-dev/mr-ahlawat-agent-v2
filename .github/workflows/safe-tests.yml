name: Safe Tests (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax and isolated test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Run project tests
        run: npm test
        env:
          CI: "true"
